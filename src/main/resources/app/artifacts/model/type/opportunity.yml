---
id: opportunity
name:
  ru: Возможность
  en: Opportunity
storageType: ECOS_MODEL
parentRef: emodel/type@case
inheritForm: false
dispNameTemplate:
  ru: ${name}
workspaceScope: PRIVATE
actions:
  - uiserv/action@edit
  - uiserv/action@delete
defaultCreateVariant: true
model:
  roles:
    - id: manager
      name:
        ru: Ответственный
        en: Manager
      computed:
        type: SCRIPT
        config:
          fn: |
            const manager = value.load('manager?id');
            if (manager === null) {
                return "GROUP_crm-manager";
            }
            return manager;
    - id: viewers
      name:
        en: Viewers
        ru: Наблюдатели
      computed:
        type: ATTRIBUTE
        config:
          attribute: viewers
    - id: allCRMManagers
      name:
        en: All CRM Managers
        ru: Все менеджеры CRM
      assignees:
        - GROUP_crm-manager
    - id: cco
      name:
        ru: Коммерческий директор
        en: CCO
      assignees:
        - GROUP_crm-cco
    - id: crmAdministrators
      name:
        ru: Администраторы CRM
        en: CRM Administrators
      assignees:
        - GROUP_crm-administrators
  attributes:
    - id: name
      name:
        ru: Название
        en: Name
    - id: amount
      name:
        ru: Бюджет
        en: Budget
      type: NUMBER
    - id: description
      name:
        ru: Описание
        en: Description
    - id: counterparty
      name:
        ru: Контрагент
        en: Counterparty
      type: ASSOC
      config:
        typeRef: emodel/type@ecos-counterparty
        child: false
    - id: manager
      name:
        ru: Ответственный
        en: Manager
      type: PERSON
    - id: viewers
      name:
        ru: Наблюдатели
        en: Viewers
      type: PERSON
      multiple: true
    - id: dateReceived
      name:
        ru: Дата создания
        en: Received date
      type: DATETIME
      computed:
        storingType: ON_EMPTY
        config:
          fn: |
            return new Date();
        type: SCRIPT
    - id: requestSource
      name:
        ru: Источник обращения
        en: Request source
      type: ASSOC
      config:
        typeRef: emodel/type@deal-request-source
        child: false
    - id: requestCategory
      name:
        ru: Категория обращения
        en: Request category
      type: ASSOC
      config:
        typeRef: emodel/type@deal-request-category
        child: false
    - id: siteEmail
      name:
        ru: E-mail заявки с сайта
        en: Site e-mail
    - id: siteFrom
      name:
        ru: Страница заполнения заявки
        en: Deal request page
    - id: emessage
      name:
        ru: Почтовое сообщение
        en: Post message
    - id: syncRequestSourceCount
      name:
        ru: Количество попыток синхронизации с YM
      type: NUMBER
      computed:
        type: VALUE
        config:
          value: '0'
        storingType: ON_CREATE
    - id: ga_client_id
      name:
        ru: Идентификатор GA
        en: GA ID
    - id: ym_client_id
      name:
        ru: Идентификатор YM
        en: YM ID
    - id: contacts
      name:
        ru: Контакты
        en: Contacts
      type: JSON
      multiple: true
    - id: numberOfUsers
      name:
        ru: Количество пользователей
        en: Number of users
    - id: phoneDigits
      name:
        ru: Телефон (цифры)
        en: Phone digits
      type: TEXT
      multiple: true
      # a GIN index over VARCHAR[] - it is NOT created unless this flag is set explicitly
      index:
        enabled: true
      computed:
        type: SCRIPT
        storingType: ON_MUTATE
        config:
          fn: |
            // Normalized E.164 lookup keys of every phone of the record, see ECOSCRM-106.
            // The collectPhoneKeys function below must stay character-identical to its copies in
            // ecos-datalist/src/main/resources/app/artifacts/model/type/ecos-counterparty.yml and
            // in the Mango route of COREDEV-510: a divergence in any step makes the keys differ
            // and the lookup silently miss.
            function collectPhoneKeys(raw, target) {
                if (raw === null || raw === undefined) {
                    return;
                }
                // split before extracting the digits: the other way round an extension glues
                // itself to the main number and produces a key that does not exist
                var parts = ('' + raw).split(/[,;#\/\r\n]|доб|доп|вн\.?|ext/i);
                for (var p = 0; p < parts.length; p++) {
                    var digits = parts[p].replace(/[^0-9]/g, '');
                    // E.164 bounds: fewer than ten digits is not a number at all, and more than
                    // fifteen is past the standard maximum. The upper bound is also what discards
                    // two numbers glued together by a space, which used to be cut to ten digits
                    // and produce a key belonging to nobody.
                    if (digits.length < 10 || digits.length > 15) {
                        continue;
                    }
                    // The key is the number in E.164, country code included. No country table is
                    // needed: only the Russian trunk prefix is unfolded, and a bare ten-digit
                    // number defaults to +7. Everything else keeps every digit it came with, so a
                    // CIS number stays itself instead of being cut to ten digits and colliding
                    // with a Russian one - +998 12 XXX XX XX and +7 812 XXX-XX-XX would both have
                    // given 812XXXXXXX. Deciding "this number is Russian" by length is not
                    // possible: +38050215956 is eleven digits and Ukrainian.
                    var key = digits;
                    if (digits.length === 10) {
                        key = '7' + digits;
                    } else if (digits.length === 11 && digits.charAt(0) === '8') {
                        key = '7' + digits.substring(1);
                    }
                    var known = false;
                    for (var k = 0; k < target.length; k++) {
                        if (target[k] === key) {
                            known = true;
                            break;
                        }
                    }
                    if (!known) {
                        target.push(key);
                    }
                }
            }

            var result = [];
            // Contacts are the only source. deal also carries a scalar `phone`, but it is marked
            // #Deprecated in deal.yml and every one of the 1213 production deals that fill it
            // repeat the very same string in contacts[].contactPhone - checked on two samples,
            // 45 records, not one divergence. Reading it would add no key on production while
            // tying this attribute to a field that is meant to disappear. It was briefly a source
            // (commit ca14fd6) after deals with an empty `contacts` turned up on the stand; those
            // turned out to be stand-only junk, not the production shape.
            var sources = [
                value.load('contacts[].contactPhone')
            ];
            for (var s = 0; s < sources.length; s++) {
                var phones = sources[s];
                if (phones === null || phones === undefined) {
                    continue;
                }
                if (typeof phones === 'string' || typeof phones === 'number') {
                    phones = [phones];
                }
                for (var i = 0; i < phones.length; i++) {
                    collectPhoneKeys(phones[i], result);
                }
            }
            return result;
aspects:
  # opportunity is not one of the platform's abstract types (base, user-base, case, data-list,
  # authority - EModelTypeUtils.ABSTRACT_TYPES), so it gets its own source id and its own table,
  # and defaultCreateVariant: true lets a record of the type itself be created. Such a record
  # records history like any other, so without this aspect every save of it would add a
  # "phoneDigits changed" line to the event history widget. deal and lead declare the aspect
  # themselves with inheritConfig: false and repeat the exclusion in their own config, so this
  # declaration changes nothing for them.
  - ref: emodel/aspect@history-config
    config:
      disableHistory: false
      excludedAtts:
        - phoneDigits
      onCreationHistoricalAtts: []
