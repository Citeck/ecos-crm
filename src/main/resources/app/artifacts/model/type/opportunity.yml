---
id: opportunity
name:
  ru: Возможность
  en: Opportunity
storageType: ECOS_MODEL
parentRef: emodel/type@case
inheritForm: false
dispNameTemplate:
  ru: ${name}
workspaceScope: PRIVATE
actions:
  - uiserv/action@edit
  - uiserv/action@delete
defaultCreateVariant: true
model:
  roles:
    - id: manager
      name:
        ru: Ответственный
        en: Manager
      computed:
        type: SCRIPT
        config:
          fn: |
            const manager = value.load('manager?id');
            if (manager === null) {
                return "GROUP_crm-manager";
            }
            return manager;
    - id: viewers
      name:
        en: Viewers
        ru: Наблюдатели
      computed:
        type: ATTRIBUTE
        config:
          attribute: viewers
    - id: allCRMManagers
      name:
        en: All CRM Managers
        ru: Все менеджеры CRM
      assignees:
        - GROUP_crm-manager
    - id: cco
      name:
        ru: Коммерческий директор
        en: CCO
      assignees:
        - GROUP_crm-cco
    - id: crmAdministrators
      name:
        ru: Администраторы CRM
        en: CRM Administrators
      assignees:
        - GROUP_crm-administrators
  attributes:
    - id: name
      name:
        ru: Название
        en: Name
    - id: amount
      name:
        ru: Бюджет
        en: Budget
      type: NUMBER
    - id: description
      name:
        ru: Описание
        en: Description
    - id: counterparty
      name:
        ru: Контрагент
        en: Counterparty
      type: ASSOC
      config:
        typeRef: emodel/type@ecos-counterparty
        child: false
    - id: manager
      name:
        ru: Ответственный
        en: Manager
      type: PERSON
    - id: viewers
      name:
        ru: Наблюдатели
        en: Viewers
      type: PERSON
      multiple: true
    - id: dateReceived
      name:
        ru: Дата создания
        en: Received date
      type: DATETIME
      computed:
        storingType: ON_EMPTY
        config:
          fn: |
            return new Date();
        type: SCRIPT
    - id: requestSource
      name:
        ru: Источник обращения
        en: Request source
      type: ASSOC
      config:
        typeRef: emodel/type@deal-request-source
        child: false
    - id: requestCategory
      name:
        ru: Категория обращения
        en: Request category
      type: ASSOC
      config:
        typeRef: emodel/type@deal-request-category
        child: false
    - id: siteEmail
      name:
        ru: E-mail заявки с сайта
        en: Site e-mail
    - id: siteFrom
      name:
        ru: Страница заполнения заявки
        en: Deal request page
    - id: emessage
      name:
        ru: Почтовое сообщение
        en: Post message
    - id: syncRequestSourceCount
      name:
        ru: Количество попыток синхронизации с YM
      type: NUMBER
      computed:
        type: VALUE
        config:
          value: '0'
        storingType: ON_CREATE
    - id: ga_client_id
      name:
        ru: Идентификатор GA
        en: GA ID
    - id: ym_client_id
      name:
        ru: Идентификатор YM
        en: YM ID
    - id: contacts
      name:
        ru: Контакты
        en: Contacts
      type: JSON
      multiple: true
    - id: numberOfUsers
      name:
        ru: Количество пользователей
        en: Number of users
    - id: phoneDigits
      name:
        ru: Телефон (цифры)
        en: Phone digits
      type: TEXT
      multiple: true
      # a GIN index over VARCHAR[] - it is NOT created unless this flag is set explicitly
      index:
        enabled: true
      computed:
        type: SCRIPT
        storingType: ON_MUTATE
        config:
          fn: |
            // Normalized 10-digit lookup keys of every phone of the record, see ECOSCRM-106.
            // The collectPhoneKeys function below must stay character-identical to its copies in
            // ecos-datalist/model/type/ecos-counterparty.yml and in the Mango route of COREDEV-510:
            // a divergence in any step makes the keys differ and the lookup silently miss.
            function collectPhoneKeys(raw, target) {
                if (raw === null || raw === undefined) {
                    return;
                }
                // split before extracting the digits: the other way round an extension glues
                // itself to the main number and produces a key that does not exist
                var parts = ('' + raw).split(/[,;#\/\r\n]|доб|доп|вн\.?|ext/i);
                for (var p = 0; p < parts.length; p++) {
                    var digits = parts[p].replace(/[^0-9]/g, '');
                    if (digits.length < 10) {
                        continue;
                    }
                    var key = digits.substring(digits.length - 10);
                    var known = false;
                    for (var k = 0; k < target.length; k++) {
                        if (target[k] === key) {
                            known = true;
                            break;
                        }
                    }
                    if (!known) {
                        target.push(key);
                    }
                }
            }

            var result = [];
            var phones = value.load('contacts[].contactPhone');
            if (phones !== null && phones !== undefined) {
                if (typeof phones === 'string' || typeof phones === 'number') {
                    phones = [phones];
                }
                for (var i = 0; i < phones.length; i++) {
                    collectPhoneKeys(phones[i], result);
                }
            }
            return result;
