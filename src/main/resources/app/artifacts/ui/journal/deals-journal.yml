---
id: deals-journal
name:
  ru: Сделки
  en: Deals
defaultFilters:
  - t: not
    val:
      t: eq
      att: _status
      val: community
  - t: not
    val:
      t: eq
      att: source
      val: old
  - t: not
    val:
      t: eq
      att: _status
      val: dropout
typeRef: emodel/type@deal
defaultSortBy:
  - attribute: dateReceived
    ascending: false
actions:
  - uiserv/action@view-dashboard
  - uiserv/action@view-dashboard-in-background
  - uiserv/action@edit
  - uiserv/action@delete
  - uiserv/action@deal-change-status
  - uiserv/action@assign-manager
columns:
  - id: number
    name:
      ru: Номер
      en: Number
    type: NUMBER
    formatter:
      type: link
  - id: name
    name:
      ru: Название
      en: Name
    type: TEXT
  - id: _status
    name:
      ru: Статус
      en: Status
    type: TEXT
    groupable: true
  - id: _stage
    name:
      ru: Этап
      en: Stage
    type: TEXT
    groupable: true
  - id: dateReceived
    name:
      ru: Дата создания
      en: Received date
    type: DATETIME
    groupable: true
  - id: amount
    name:
      ru: Бюджет
      en: Budget
    type: NUMBER
  - id: manager
    name:
      ru: Ответственный
      en: Responsible
    type: PERSON
    groupable: true
  - id: viewers
    name:
      en: Viewers
      ru: Наблюдатели
    type: PERSON
    groupable: true
  - id: description
    name:
      ru: Описание
      en: Description
    type: TEXT
  - id: counterparty
    name:
      ru: Контрагент
      en: Counterparty
    type: ASSOC
  - id: fio
    name:
      ru: ФИО
      en: Full name
    type: TEXT
    attribute: contacts.contactFio
  - id: email
    name:
      ru: E-mail
    type: TEXT
    attribute: contacts.contactEmail
  - id: phoneDigits
    name:
      ru: Номера тел.
      en: Phone digits
    type: TEXT
    multiple: true
    # The only phone column: the old "Телефон" (contacts.contactPhone) is gone, because it could
    # neither be filtered (a predicate over a path inside JSON is cut to alwaysFalse) nor show more
    # than the first contact (uiserv rejects contacts[].contactPhone as a column attribute).
    # Filtering here is an exact match of one array element (&& ARRAY[?]), not a substring search,
    # so the value to type is the whole E.164 key - 79161177716 for +7 916 117-77-16. Shown by
    # default on purpose: a column hidden with visible: false is dropped from the quick "find" box
    # as well, so the number would be searchable nowhere until the user switched the column on.
    attribute: phoneDigits
    visible: true
    searchable: true
    searchableByText: true
    formatter:
      type: script
      config:
        # The stored value is an E.164 key - digits only, country code included - so the column
        # would otherwise be a wall of digits. Grouping is by LENGTH, not by a table of country
        # codes: eleven digits behind a 7 is the Russian and Kazakh shape, twelve digits is a
        # three-digit country code plus nine national ones, which covers every CIS country that
        # has one. This is display only, so a country whose real grouping differs just looks
        # slightly off - unlike the normalization itself, which must stay free of country tables
        # because it is copied into other repositories and any divergence makes lookups miss.
        # Filtering this column still expects the whole key: 79161177716.
        fn: |
          var d = String(cell || '').replace(/[^0-9]/g, '');
          if (!d) {
              return cell;
          }
          if (d.length === 11 && d.charAt(0) === '7') {
              return '+7 (' + d.substr(1, 3) + ') ' + d.substr(4, 3)
                  + '-' + d.substr(7, 2) + '-' + d.substr(9, 2);
          }
          if (d.length === 12) {
              return '+' + d.substr(0, 3) + ' ' + d.substr(3, 2) + ' ' + d.substr(5, 3)
                  + '-' + d.substr(8, 2) + '-' + d.substr(10, 2);
          }
          return '+' + d;
  - id: e_message
    name:
      ru: Письмо
      en: Message
    type: TEXT
    attribute: createdFromLead.emessage
  - id: requestSource
    name:
      ru: Источник обращения
      en: Request source
    type: ASSOC
  - id: requestCategory
    name:
      ru: Категория обращения
      en: Request category
    type: ASSOC
  - id: createdFromLead
    name:
      ru: Создана из лида
      en: Created from lead
    type: ASSOC
    visible: false
  - id: contract
    name:
      ru: Договор
      en: Contract
    type: ASSOC
    visible: false
