---
id: fill-opportunity-phone-digits
# A patch re-runs only when the deployed date is after the one already stored (EcosPatchConfig
# resets it to PENDING on a newer date). Stands that applied an earlier version of this patch would
# otherwise keep the old result forever and nothing would report it. Raised twice so far:
#   12:00 - the predicate below was added, and `phone` became a source of the script;
#   19:00 - the key moved from ten digits to E.164, so every stored key has to be recomputed;
#   21:00 - the deprecated `phone` stopped being a source, so deals that filled only it lose
#           their key and deals that filled it with another number lose one of two.
date: 2026-09-15T21:00:00Z
type: mutate
targetApp: emodel
config:
  records:
    - id: emodel/group-action@
      attributes:
        values:
          type: admin-action-records-of-type
          config:
            typeRef: emodel/type@opportunity
            # `update-calculated-atts` recomputes EVERY computed attribute of the type, not only
            # phoneDigits: ON_CREATE atts and counters are skipped for existing records, but
            # ON_EMPTY ones are evaluated whenever the current value is empty. opportunity declares
            # dateReceived as ON_EMPTY `return new Date()`, so a record with an empty dateReceived
            # would be stamped with the run time of this patch as its creation date - irreversibly,
            # on every stand this patch reaches. The selector therefore excludes exactly those
            # records: they keep an empty phoneDigits instead of losing their creation date.
            # To cover them, first fill dateReceived from _created, then re-run this patch by
            # raising `date` - see the "Заполнение существующих записей" section of
            # ecos-crm/docs/phone-digits.md.
            predicate:
              t: not
              val:
                t: empty
                att: dateReceived
        execution:
          type: update-calculated-atts
